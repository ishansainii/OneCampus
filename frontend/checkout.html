<!-- part of payment.html or checkout.html -->
<div class="mt-4">
    <label for="delivery-location" class="block text-sm font-medium text-gray-700">Select Delivery Location</label>
    <select id="delivery-location" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded">
        <!-- Options fetched from backend -->
    </select>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Fetch delivery locations from backend
        fetch('/api/delivery-locations') // Replace with actual API endpoint
            .then(response => response.json())
            .then(data => {
                const locationSelect = document.getElementById('delivery-location');
                data.locations.forEach(location => {
                    const option = document.createElement('option');
                    option.value = location.id;
                    option.textContent = location.name;
                    locationSelect.appendChild(option);
                });
            })
            .catch(error => console.error('Error fetching delivery locations:', error));
    });
</script>
